services:
  # ============================================================================
  # Database: PostgreSQL 16
  # Single source of truth for both application state and durable job queue
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mura_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mura}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mura-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mura} -d $${POSTGRES_DB:-mura}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Schema Migration: Alembic
  # One-off runner applying migrations before API or Worker accept traffic
  # ============================================================================
  db-migrate:
    build:
      context: ./Mura_project
      dockerfile: Dockerfile
    container_name: mura-db-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mura}:${POSTGRES_PASSWORD:-mura_secret_change_me}@postgres:5432/${POSTGRES_DB:-mura}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mura-network

  # ============================================================================
  # Backend: FastAPI Core API
  # HTTP requests, job creation, user authentication & capabilities
  # ============================================================================
  api:
    build:
      context: ./Mura_project
      dockerfile: Dockerfile
    container_name: mura-api
    restart: unless-stopped
    environment:
      MURA_ENVIRONMENT: ${MURA_ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mura}:${POSTGRES_PASSWORD:-mura_secret_change_me}@postgres:5432/${POSTGRES_DB:-mura}
      DATABASE_AUTO_CREATE: "false"
      CORE_API_KEY: ${CORE_API_KEY}
      WORKER_REGISTRATION_TOKEN: ${WORKER_REGISTRATION_TOKEN}
      OPERATIONS_API_KEY: ${OPERATIONS_API_KEY}
      KAGGLE_ASR_API_KEY: ${KAGGLE_ASR_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-mura-core}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ALLOWED_ALGORITHMS: ${AUTH_ALLOWED_ALGORITHMS:-RS256}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUDIO_STORAGE_BACKEND: local
      AUDIO_STORAGE_DIR: /app/data/audio
      BOOK_STORAGE_BACKEND: ${BOOK_STORAGE_BACKEND:-local}
      BOOK_STORAGE_DIR: /app/data/books
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BOOKS_BUCKET: ${SUPABASE_BOOKS_BUCKET:-mura-books}
      CORE_MAX_UPLOAD_MB: 25
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/app/data/audio
      - book_data:/app/data/books
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mura-network

  # ============================================================================
  # Worker: Standalone Recording Job Worker
  # Worker: Standalone Recording & Book Job Worker
  # Claims background jobs via SELECT FOR UPDATE SKIP LOCKED with lease/heartbeat
  # ============================================================================
  worker:
    build:
      context: ./Mura_project
      dockerfile: Dockerfile.worker
    container_name: mura-worker
    restart: unless-stopped
    command: ["mura-worker"]
    environment:
      MURA_ENVIRONMENT: ${MURA_ENVIRONMENT:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mura}:${POSTGRES_PASSWORD:-mura_secret_change_me}@postgres:5432/${POSTGRES_DB:-mura}
      CORE_API_KEY: ${CORE_API_KEY}
      WORKER_REGISTRATION_TOKEN: ${WORKER_REGISTRATION_TOKEN}
      OPERATIONS_API_KEY: ${OPERATIONS_API_KEY}
      KAGGLE_ASR_API_KEY: ${KAGGLE_ASR_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-pro}
      ASR_PROVIDER: ${ASR_PROVIDER:-whisper}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-https://api.openai.com/v1}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      AUDIO_STORAGE_BACKEND: local
      AUDIO_STORAGE_DIR: /app/data/audio
      BOOK_STORAGE_BACKEND: ${BOOK_STORAGE_BACKEND:-local}
      BOOK_STORAGE_DIR: /app/data/books
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BOOKS_BUCKET: ${SUPABASE_BOOKS_BUCKET:-mura-books}
    volumes:
      - audio_data:/app/data/audio
      - book_data:/app/data/books
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - mura-network

  # ============================================================================
  # Frontend: Next.js 15 App Router
  # Server-side proxy with bearer token forwarding, UI, and auth integration
  # ============================================================================
  frontend:
    build:
      context: ./MURA-app
      dockerfile: Dockerfile
    container_name: mura-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      MURA_API_URL: http://api:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_TEMPLATE: ${CLERK_JWT_TEMPLATE:-mura-core}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mura-network

volumes:
  postgres_data:
    driver: local
  audio_data:
    driver: local
  book_data:
    driver: local

networks:
  mura-network:
    driver: bridge

