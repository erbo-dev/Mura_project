name: Frontend CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
      - "fix/**"
      - "feat/**"
      - "ci/**"
    paths:
      - "MURA-app/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "MURA-app/**"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MURA-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "MURA-app/package-lock.json"

      - name: Refresh security lockfile
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev

      - name: Save refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-frontend-lock
          path: MURA-app/package-lock.json
          if-no-files-found: error

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.ref_name == 'ci/container-and-frontend-audit'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(frontend): refresh security lockfile [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
