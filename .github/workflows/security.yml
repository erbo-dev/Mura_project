name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Verified secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail on verified secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.9
          extra_args: --results=verified --exclude-detectors=Lob

  dependency-audit:
    name: Backend and frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: Mura_project
        run: python -m pip install -e ".[dev,books]"
      - name: Audit installed Python dependencies
        run: pip-audit
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: MURA-app/package-lock.json
      - name: Install frontend dependencies
        working-directory: MURA-app
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: MURA-app
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request' && vars.MURA_DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-review-unavailable:
    name: Dependency graph unavailable
    if: github.event_name == 'pull_request' && vars.MURA_DEPENDENCY_GRAPH_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report missing dependency graph
        run: |
          echo '::warning::BLOCKED: GitHub dependency graph is disabled; dependency-review action did not run. Enable dependency graph and set MURA_DEPENDENCY_GRAPH_ENABLED=true.'
          echo 'BLOCKED: dependency-review action did not run; enable the repository dependency graph and set MURA_DEPENDENCY_GRAPH_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
