name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "Mura_project/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Mura_project/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Test & Verify Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:mura_ci@127.0.0.1:5432/mura_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:mura_ci@127.0.0.1:5432/mura_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mura_ci
          POSTGRES_DB: mura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Mura_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,books]

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Bytecode compilation check
        run: python -m compileall -q src/mura apps tests

      - name: Run pytest test suite
        run: python -m pytest
