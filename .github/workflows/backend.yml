name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - "fix/**"
      - "feat/**"
      - "ci/**"
    paths:
      - "Mura_project/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Mura_project/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Python 3.11 — verify backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:mura_ci@127.0.0.1:5432/mura_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:mura_ci@127.0.0.1:5432/mura_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mura_ci
          POSTGRES_DB: mura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Mura_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up production Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,books]

      - name: Determine changed Python files
        id: pyfiles
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          LINT_FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- '*.py' \
            | grep '^Mura_project/' \
            | sed 's#^Mura_project/##' \
            | tr '\n' ' ' || true)"
          TYPE_FILES="$(printf '%s\n' $LINT_FILES \
            | grep -E '^(src/mura|apps)/' \
            | tr '\n' ' ' || true)"
          echo "lint_files=$LINT_FILES" >> "$GITHUB_OUTPUT"
          echo "type_files=$TYPE_FILES" >> "$GITHUB_OUTPUT"

      - name: Ruff lint changed Python
        if: steps.pyfiles.outputs.lint_files != ''
        run: ruff check ${{ steps.pyfiles.outputs.lint_files }}

      - name: Ruff format check changed Python
        if: steps.pyfiles.outputs.lint_files != ''
        run: ruff format --check ${{ steps.pyfiles.outputs.lint_files }}

      - name: Mypy changed backend modules
        if: steps.pyfiles.outputs.type_files != ''
        run: mypy ${{ steps.pyfiles.outputs.type_files }}

      - name: Bandit changed backend modules
        if: steps.pyfiles.outputs.type_files != ''
        run: bandit -c pyproject.toml ${{ steps.pyfiles.outputs.type_files }}

      - name: Dependency vulnerability audit
        run: pip-audit

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Verify single Alembic head
        run: |
          HEAD_COUNT="$(alembic heads | grep -c '(head)')"
          test "$HEAD_COUNT" -eq 1

      - name: Bytecode compilation check
        run: python -m compileall -q src/mura apps tests

      - name: Run PostgreSQL concurrency gate
        run: |
          python -m pytest -q \
            tests/test_postgres_atomicity.py::test_postgres_concurrent_book_creation_serializes_on_family_lock \
            tests/test_postgres_atomicity.py::test_postgres_concurrent_family_deletes_converge_to_one_result \
            tests/test_postgres_atomicity.py::test_postgres_family_delete_rechecks_owner_count_after_membership_race \
            tests/test_postgres_atomicity.py::test_postgres_concurrent_recording_creation_respects_family_daily_limit \
            tests/test_postgres_atomicity.py::test_postgres_concurrent_recording_creation_respects_user_daily_limit_across_families \
            tests/test_identity_families.py::test_postgres_account_delete_vs_owner_promotion_never_orphans_family

      - name: Run pytest with coverage measurement
        run: |
          python -m pytest \
            --cov=src/mura \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml

  containers:
    name: Build production containers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mura_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file Dockerfile --tag mura-api:ci .

      - name: Build worker image
        run: docker build --file Dockerfile.worker --tag mura-worker:ci .

  compatibility:
    name: Python 3.13 — compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mura_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,books]

      - name: Bytecode compilation check
        run: python -m compileall -q src/mura apps tests

      - name: Run non-PostgreSQL suite
        env:
          TEST_POSTGRES_URL: ""
        run: python -m pytest
