name: Continuous offline evaluation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Mura_project
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install deterministic evaluator
        run: python -m pip install -e ".[dev]"
      - name: Validate workflow policy
        run: python scripts/ci/check_workflow_policy.py
      - name: Run provider-free ML release gate
        run: |
          mkdir -p artifacts
          mura-evaluate-ml-release --manifest benchmarks/release/ml_release_manifest.json --json-output artifacts/ml-release-report.json --markdown-output artifacts/ml-release-report.md
      - name: Preserve evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continuous-evaluation-${{ github.run_id }}
          path: Mura_project/artifacts/ml-release-report.*
          if-no-files-found: warn
          retention-days: 30
